<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Personalinloggning | Skaraborg Maskin & Återbruk</title><style>*{box-sizing:border-box}body{margin:0;background:#eff4ef;color:#193c26;font:16px/1.5 system-ui,sans-serif}.wrap{max-width:520px;margin:8vh auto;padding:20px}.card{background:#fff;padding:26px;border:1px solid #d2e1d6;border-radius:18px;box-shadow:0 10px 35px #173d2714}h1{font-size:27px;margin:0 0 8px}p{color:#55725f}label{display:block;font-weight:650;margin:14px 0 5px}input{width:100%;border:1px solid #a9bbaf;border-radius:9px;padding:12px;font:inherit}button,.link{border:0;display:block;text-align:center;border-radius:9px;padding:13px 16px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;width:100%;margin-top:12px;background:#1e5031;color:#fff}.link.secondary{background:#e2f0e5;color:#19432a}.hidden{display:none!important}#status{min-height:25px}a.back{color:#205237}button:disabled{opacity:.6}</style></head><body><main class="wrap"><div class="card"><h1>Personalinloggning</h1><p>Skaraborg Maskin & Återbruk</p><p id="status" role="status">Kontrollerar inloggningen …</p><form id="login" class="hidden"><label for="email">E-postadress</label><input id="email" type="email" autocomplete="username" required><label for="password">Lösenord</label><input id="password" type="password" autocomplete="current-password" required><button type="submit" id="submit">Logga in</button></form><section id="panel" class="hidden"><p>Du är inloggad som behörig administratör.</p><a class="link" href="/admin.html">Hantera annonser</a><a class="link secondary" href="/tavling-admin.html">Hantera tävlingar</a><a class="link secondary" href="/veckoblogg-admin.html">Veckobloggen – anteckningar & publicering</a><button id="logout" type="button">Logga ut</button></section><p><a class="back" href="/">← Till hemsidan</a></p></div></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://jnorvriiehandxlvwkkg.supabase.co','sb_publishable_VZCeFFISX9vzOMlVxYVchg_w1UWYpYR',{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id);function view(ok){$('login').classList.toggle('hidden',ok);$('panel').classList.toggle('hidden',!ok)}async function check(){const {data,error}=await db.auth.getUser();if(error||!data.user){view(false);$('status').textContent='Logga in med ditt administratörskonto.';return}const r=await db.from('ad_editors').select('user_id').eq('user_id',data.user.id).maybeSingle();if(r.error||!r.data){view(false);$('status').textContent='Kontot saknar administratörsbehörighet.';return}view(true);$('status').textContent='Inloggningen är godkänd.'} $('login').addEventListener('submit',async e=>{e.preventDefault();const b=$('submit');b.disabled=true;$('status').textContent='Loggar in …';try{const r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)throw r.error;$('password').value='';await check()}catch(err){view(false);$('status').textContent='Kunde inte logga in: '+err.message}finally{b.disabled=false}});$('logout').addEventListener('click',async()=>{await db.auth.signOut();view(false);$('status').textContent='Du är utloggad.'});check().catch(()=>{$('status').textContent='Det gick inte att kontrollera behörigheten just nu.';view(false)});</script></body></html>
