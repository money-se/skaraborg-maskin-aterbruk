<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Privat meddelandetest</title><style>body{font:16px system-ui;max-width:680px;margin:30px auto;padding:14px;background:#f6f8f5;color:#183c23}section{background:white;padding:18px;border-radius:12px;margin:15px 0}input,button{font:inherit;padding:12px;margin:5px 0;max-width:100%}input{display:block;width:90%}button{background:#194c2a;color:white;border:0;border-radius:8px}button:disabled{opacity:.5}#info{white-space:pre-wrap}a{color:#155838}</style><h1>Privat test av meddelanden</h1><p>Endast för behörig administratör. Låtsasannonser är dolda för kunder. Kör radering efteråt.</p><section id="login"><form id="loginForm"><input type="email" id="email" placeholder="E-post" required><input type="password" id="pass" placeholder="Lösenord" required><button>Logga in</button></form></section><section id="controls" hidden><p id="info"></p><button id="create">1. Skapa testannons och meddelande</button><p><a href="annonsinkorg-v3.html" target="_blank" rel="noopener">2. Öppna inkorgen och svara</a></p><button id="cleanup" disabled>3. Markera som såld och radera testdata</button><button id="logout">Logga ut</button></section><p id="status" role="status"></p><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://jnorvriiehandxlvwkkg.supabase.co','sb_publishable_VZCeFFISX9vzOMlVxYVchg_w1UWYpYR'),api='https://jnorvriiehandxlvwkkg.supabase.co/functions/v1/ad-messages-test';let testId=null;const $=id=>document.getElementById(id);function status(t){$('status').textContent=t}async function check(){const s=(await db.auth.getSession()).data.session;$('login').hidden=!!s;$('controls').hidden=!s;if(s)status('Inloggad. Skapa ett separat test.')};async function call(action){const s=(await db.auth.getSession()).data.session;if(!s)throw Error('Logga in först');const r=await fetch(api,{method:'POST',headers:{'content-type':'application/json',apikey:'sb_publishable_VZCeFFISX9vzOMlVxYVchg_w1UWYpYR',authorization:'Bearer '+s.access_token},body:JSON.stringify({action,ad_id:testId})});const d=await r.json();if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d};$('loginForm').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(r.error)status(r.error.message);else{ $('pass').value='';await check()}};$('create').onclick=async()=>{try{$('create').disabled=true;const d=await call('create');testId=d.ad_id;$('cleanup').disabled=false;$('info').textContent='Testannons skapad: '+testId+'\nGå till inkorgen och svara på meddelandet.';status('Testkonversation skapad.')}catch(e){status('Fel: '+e.message);$('create').disabled=false}};$('cleanup').onclick=async()=>{if(!confirm('Markera testannonsen som såld och ta bort all testdata?'))return;try{const d=await call('cleanup');status(d.ok?'Test lyckades: alla konversationer raderades och annonsen togs bort.':'Test ej verifierat');testId=null;$('cleanup').disabled=true;$('create').disabled=false;$('info').textContent=''}catch(e){status('Fel: '+e.message)}};$('logout').onclick=async()=>{await db.auth.signOut();testId=null;await check()};check();</script></html>
