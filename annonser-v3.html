<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Maskiner till salu · Skaraborg Maskin & Återbruk</title><style>
*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f4f7f3;color:#16261b}.wrap{max-width:1120px;margin:auto;padding:20px}header{background:#1b3825;color:white;padding:36px 0}h1{font-size:clamp(28px,5vw,43px);margin:0}.sub{color:#e3ebe2}.card{background:white;border:1px solid #d6e2d9;border-radius:13px;overflow:hidden}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:15px;margin-top:20px}.card img,.placeholder{width:100%;height:175px;object-fit:cover;background:#eaf0e9}.placeholder{display:grid;place-items:center;color:#677a6b}.body{padding:15px}.body h2{font-size:18px;line-height:1.35;margin:0 0 7px}.price{font-size:20px;font-weight:800}.badge{background:#e9eee9;border-radius:6px;padding:4px 8px;font-size:13px}.pending{background:#fff1d6}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}input,button{font:inherit;border:1px solid #abc1ad;border-radius:9px;padding:11px}input{flex:1;min-width:230px}button{cursor:pointer;background:#1b482a;color:white;font-weight:700}.body button{margin-top:13px;width:100%}.detail{border:1px solid #d6e2d9;background:white;padding:20px;border-radius:13px}.detail img{width:100%;max-height:470px;object-fit:contain}.description{white-space:pre-wrap}.thumb{display:flex;gap:8px;flex-wrap:wrap}.thumb button{background:#edf2eb;padding:4px}.thumb img{width:80px;height:80px;object-fit:cover}.muted{color:#5b6f61}.hidden{display:none!important}
</style></head><body><header><div class="wrap"><h1>Maskiner och redskap till salu</h1><p class="sub">Skaraborg Maskin & Återbruk · Hjo</p></div></header><main class="wrap">
<p class="muted">Förhandsvisning av en framtida annonseringssida. Ännu inte publicerad på skaraborgmaskin.se.</p>
<div id="overview"><div class="controls"><input id="q" type="search" placeholder="Sök bland våra annonser"><button id="refresh">Uppdatera</button></div><p id="status" role="status">Hämtar annonser ...</p><div id="products" class="products"></div></div>
<div id="detail" class="detail hidden"></div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://jnorvriiehandxlvwkkg.supabase.co','sb_publishable_VZCeFFISX9vzOMlVxYVchg_w1UWYpYR',{auth:{persistSession:false,autoRefreshToken:false}});
const $=id=>document.getElementById(id);let records=[];
function imageUrl(path){return db.storage.from('ad-images').getPublicUrl(path).data.publicUrl}
function button(label,fn){const b=document.createElement('button');b.textContent=label;b.addEventListener('click',fn);return b}
async function load(){const r=await db.from('ads').select('id,title,description,price_sek,status,image_paths,created_at').in('status',['sale','pending']).eq('published',true).order('created_at',{ascending:false}).limit(300);if(r.error){$('status').textContent='Kunde inte hämta annonser just nu.';return}records=r.data;render()}
function render(){const q=$('q').value.trim().toLocaleLowerCase('sv-SE');const items=records.filter(x=>x.title.toLocaleLowerCase('sv-SE').includes(q));$('status').textContent=items.length+' annonser';const list=$('products');list.replaceChildren();for(const ad of items){const card=document.createElement('article');card.className='card';if(ad.image_paths?.length){const img=document.createElement('img');img.src=imageUrl(ad.image_paths[0]);img.loading='lazy';img.alt=ad.title;card.append(img)}else{const p=document.createElement('div');p.className='placeholder';p.textContent='Bild saknas';card.append(p)}const body=document.createElement('div');body.className='body';const h=document.createElement('h2');h.textContent=ad.title;body.append(h);const price=document.createElement('div');price.className='price';price.textContent=ad.price_sek.toLocaleString('sv-SE')+' kr';body.append(price);const badge=document.createElement('span');badge.className='badge'+(ad.status==='pending'?' pending':'');badge.textContent=ad.status==='pending'?'Väntande – reserverad':'Till salu';body.append(badge);body.append(button('Visa annons',()=>detail(ad)));card.append(body);list.append(card)}}
function detail(ad){$('overview').classList.add('hidden');const box=$('detail');box.replaceChildren();box.append(button('← Tillbaka',()=>{box.classList.add('hidden');$('overview').classList.remove('hidden')}));const title=document.createElement('h2');title.textContent=ad.title;box.append(title);const price=document.createElement('h3');price.textContent=ad.price_sek.toLocaleString('sv-SE')+' kr';box.append(price);if(ad.image_paths?.length){const image=document.createElement('img');image.src=imageUrl(ad.image_paths[0]);image.alt=ad.title;box.append(image);const thumbs=document.createElement('div');thumbs.className='thumb';for(const path of ad.image_paths){const b=button('Visa',()=>image.src=imageUrl(path));thumbs.append(b)}box.append(thumbs)}const state=document.createElement('p');state.textContent=ad.status==='pending'?'Reserverad eller inväntar hämtning.':'Till salu';box.append(state);const desc=document.createElement('p');desc.className='description';desc.textContent=ad.description||'Kontakta oss för mer information.';box.append(desc);const contact=document.createElement('p');const link=document.createElement('a');link.href='annonskontakt-v3.html?ad='+encodeURIComponent(ad.id);link.textContent='Skicka meddelande om den här annonsen';contact.append(link);box.append(contact);box.classList.remove('hidden');window.scrollTo(0,0)}
$('q').addEventListener('input',render);$('refresh').addEventListener('click',load);load();
</script></body></html>
