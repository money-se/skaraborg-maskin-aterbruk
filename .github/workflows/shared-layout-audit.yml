name: Shared header, footer and Metricool audit
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'partials1/**'
      - 'scripts/check-shared-layout.mjs'
      - 'data/habo-service-template.html.txt'
      - 'scripts/generate_*_seo.py'
      - 'maskinarkiv-2/scripts/stage-production.mjs'
  workflow_dispatch:
jobs:
  shared-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all public pages use the shared partials
        run: node scripts/check-shared-layout.mjs
