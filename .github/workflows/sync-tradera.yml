name: Synka Tradera-annonser
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: tradera-feed
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch active Tradera listings
        env:
          TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID }}
          TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
          TRADERA_SELLER_ID: "5896660"
        run: python scripts/sync_tradera.py
      - name: Commit validated feed if changed
        run: |
          if git diff --quiet -- data/tradera-items.json; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tradera-items.json
          git commit -m "Update Tradera catalogue feed"
          git push
