name: Maskinarkivet – isolerad byggning och publicering
on:
  push:
    branches: [main]
    paths:
      - 'maskinarkiv-2/src/**'
      - 'maskinarkiv-2/scripts/**'
      - 'maskinarkiv-2/package.json'
      - 'maskinarkiv-2/package-lock.json'
      - 'partials1/header.html'
      - 'partials1/footer.html'
      - '.github/workflows/maskinarkiv-2-pilot.yml'
  pull_request:
    branches: [main]
    paths:
      - 'maskinarkiv-2/**'
      - 'partials1/header.html'
      - 'partials1/footer.html'
      - '.github/workflows/maskinarkiv-2-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maskinarkivet-main-build
  cancel-in-progress: false
jobs:
  maskinarkivet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installera enbart Maskinarkivets byggverktyg
        working-directory: maskinarkiv-2
        run: npm install --no-audit --no-fund
      - name: Generera Maskinarkivet
        working-directory: maskinarkiv-2
        run: npm run build
      - name: Kontrollera strukturen
        working-directory: maskinarkiv-2
        run: npm run check
      - name: Kontrollera STIGA Park 12 HST-utkast
        working-directory: maskinarkiv-2
        run: npm run check:park12
      - name: Kontrollera SEO och länkar
        working-directory: maskinarkiv-2
        run: npm run audit
      - name: Bygg Park 12 HST webbförhandsvisning
        working-directory: maskinarkiv-2
        run: node scripts/preview-park12.mjs
      - name: Ladda upp klickbar HTML som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: stiga-park-12-hst-preview
          path: maskinarkiv-2/preview/stiga-park-12-hst.html
      - name: Uppdatera Park 12-förhandsvisning enbart på dess arbetsgren
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/maskinarkivet-stiga-park-12hst' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- maskinarkiv-2/preview/stiga-park-12-hst.html
          if ! git diff --cached --quiet; then
            test "$(git diff --cached --name-only)" = "maskinarkiv-2/preview/stiga-park-12-hst.html"
            git diff --cached --check
            git commit -m "chore: refresh STIGA Park 12 HST preview [skip ci]"
            git push origin HEAD:feature/maskinarkivet-stiga-park-12hst
          fi
      - name: Skapa granskbar byggfil
        uses: actions/upload-artifact@v4
        with:
          name: maskinarkivet-generated-html
          path: _maskinarkiv-preview/maskinarkiv/
      - name: Publicera enbart Maskinarkivets fem HTML-sidor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          # Inte en webbplatsbyggning. Exakt dessa fem HTML-filer får uppdateras.
          for slug in stiga-park-16 husqvarna-rider-13 husqvarna-lth151 stiga-villa-12-hst jonsered-lt2115; do
            cp "_maskinarkiv-preview/maskinarkiv/$slug.html" "maskinarkiv/$slug.html"
          done
          git add -- maskinarkiv/stiga-park-16.html maskinarkiv/husqvarna-rider-13.html maskinarkiv/husqvarna-lth151.html maskinarkiv/stiga-villa-12-hst.html maskinarkiv/jonsered-lt2115.html
          for changed in $(git diff --cached --name-only); do
            case "$changed" in
              maskinarkiv/stiga-park-16.html|maskinarkiv/husqvarna-rider-13.html|maskinarkiv/husqvarna-lth151.html|maskinarkiv/stiga-villa-12-hst.html|maskinarkiv/jonsered-lt2115.html) ;;
              *) echo "::error::Otillåten ändring: $changed"; exit 1 ;;
            esac
          done
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Maskinarkivets sidor är redan aktuella."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(maskinarkivet): update five generated machine guides [skip ci]"
          git push origin HEAD:main
