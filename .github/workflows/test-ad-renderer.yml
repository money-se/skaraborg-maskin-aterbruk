name: Testa annonsvisning
on:
  pull_request:
    paths:
      - 'scripts/generate_ad_seo.py'
      - 'tests/test_ad_renderer.py'
      - '.github/workflows/test-ad-renderer.yml'
permissions:
  contents: read
jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/generate_ad_seo.py
      - run: python -m unittest discover -s tests -p test_ad_renderer.py -v
