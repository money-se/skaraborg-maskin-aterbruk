-wrap:wrap}.thumb button{background:#edf2eb;padding:4px}.thumb img{width:80px;height:80px;object-fit:cover}.muted{color:#5b6f61}.hidden{display:none!important}
.detail{border:0;background:transparent;padding:0}.detail-layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(250px,1fr);gap:22px;align-items:start}.detail-main,.business-panel{border:1px solid #d6e2d9;background:#fdfefb;border-radius:15px;padding:22px;box-shadow:0 9px 30px rgba(25,58,32,.06)}.detail-main h2{font-size:clamp(25px,3vw,36px);margin:16px 0 8px}.detail-price{font-size:27px;color:#20482e;margin:0 0 16px}.gallery-main{background:#edf1eb;border-radius:12px;overflow:hidden;display:grid;place-items:center;min-height:240px}.gallery-main img{display:block;width:100%;height:auto;max-height:540px;object-fit:contain}.thumb{display:flex;flex-wrap:nowrap;gap:10px;overflow-x:auto;padding:12px 2px 8px}.thumb button{background:#f1f5ef;border:2px solid transparent;border-radius:10px;padding:3px;flex:0 0 88px;height:78px;overflow:hidden}.thumb button[aria-pressed="true"]{border-color:#1e6237;box-shadow:0 0 0 2px #d6e7d7}.thumb button img{display:block;width:100%;height:100%;object-fit:cover;border-radius:6px}.ad-meta{display:inline-block;margin:8px 0 15px;padding:5px 12px;border-radius:99px;background:#e9f2e7;color:#19482b;font-weight:700;font-size:14px}.business-panel{background:linear-gradient(155deg,#e6efe5,#f7f9f5 55%,#fff)}.business-panel h3{font-size:23px;margin:3px 0 12px;color:#184029}.business-panel p{line-height:1.6}.business-panel a{display:block;margin-top:12px;font-weight:700}.brand-banner{background:linear-gradient(105deg,#163b27,#295a37);color:#fff;border-radius:14px;padding:20px 24px;margin:16px 0 22px}.brand-banner strong{font-size:19px}.brand-banner p{margin:6px 0 0;color:#dcebdd}.business-details{padding-left:20px;line-height:1.8}.detail-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.detail-actions button{background:#ecf2eb;color:#20432c}.detail-top{margin-bottom:14px}@media(max-width:760px){.detail-layout{grid-template-columns:1fr}.detail-main,.business-panel{padding:16px}.thumb button{flex-basis:74px;height:68px}.brand-banner{padding:16px}.detail-main h2{font-size:27px}} .viewer{position:fixed;inset:0;background:rgba(10,25,15,.94);z-index:9999;display:flex;align-items:center;justify-content:center;padding:64px 18px 26px}.viewer img{max-width:95vw;max-height:84vh;object-fit:contain;border-radius:8px}.viewer button{position:absolute;top:12px;right:18px;background:#fff;color:#173821;border:0;font-size:20px}.viewer .viewer-count{position:absolute;bottom:7px;color:white;font-size:14px}.gallery-main{cursor:zoom-in}.gallery-main:focus-visible{outline:3px solid #b3d2a7}.thumb button{cursor:pointer}.detail-main{background:linear-gradient(145deg,#fff 0%,#f5f9f2 100%)}.business-panel{background:linear-gradient(155deg,#e0eee1,#f1f7ec 50%,#dfeadd)!important;border:1px solid #bed3be;box-shadow:0 14px 38px #203d2630}.business-panel:before{content:"SKARABORG MASKIN & ÅTERBRUK";display:block;font-size:11px;letter-spacing:2px;color:#497350;font-weight:800;margin-bottom:15px}.business-details li{padding:3px 0}.brand-banner{background:linear-gradient(120deg,#123b27,#285e39 58%,#163a2c);position:relative;overflow:hidden}.brand-banner:after{content:"SMÅ";position:absolute;right:12px;top:-40px;font-size:135px;font-weight:900;color:#ffffff0d;pointer-events:none}body{background:radial-gradient(circle at 9% 18%,#c8dac5 0%,transparent 36%),radial-gradient(circle at 95% 65%,#d1ddc2 0%,transparent 31%),repeating-linear-gradient(135deg,#31573808 0px,#31573808 2px,transparent 2px,transparent 28px),#e7efe4} </style></head><body><header><div class="wrap"><h1>Maskiner och redskap till salu</h1><p class="sub">Skaraborg Maskin & Återbruk · Hjo</p></div></header><main class="wrap">
<div class="trust"><span>Begagnade maskiner och redskap</span><span>Information om skick i varje annons</span><span>Kontakta oss skriftligt</span></div><p class="muted">Annonserna uppdateras av oss. Kontrollera alltid skick och tillgänglighet före köp.</p>
<div id="overview"><div class="controls"><input id="q" type="search" placeholder="Sök bland våra annonser"><button id="refresh">Uppdatera</button></div><p id="status" role="status">Hämtar annonser ...</p><div id="products" class="products"></div></div>
<div id="detail" class="detail hidden"></div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://jnorvriiehandxlvwkkg.supabase.co','sb_publishable_VZCeFFISX9vzOMlVxYVchg_w1UWYpYR',{auth:{persistSession:false,autoRefreshToken:false}});
const $=id=>document.getElementById(id);let records=[];function zoom(src,alt){const overlay=document.createElement('div');overlay.className='viewer';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-label','Förstorad annonsbild');const img=document.createElement('img');img.src=src;img.alt=alt;const close=button('× Stäng',()=>overlay.remove());overlay.append(img,close);overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});const escape=e=>{if(e.key==='Escape'){overlay.remove();document.removeEventListener('keydown',escape)}};document.addEventListener('keydown',escape);document.body.append(overlay);close.focus()}
function imageUrl(path){return db.storage.from('ad-images').getPublicUrl(path).data.publicUrl}
function button(label,fn){const b=document.createElement('button');b.textContent=label;b.addEventListener('click',fn);return b}
async function load(){const r=await db.from('ads').select('id,title,description,price_sek,status,image_paths,created_at').in('status',['sale','pending']).eq('published',true).order('created_at',{ascending:false}).limit(300);if(r.error){$('status').textContent='Kunde inte hämta annonser just nu.';return}records=r.data;render()}
function render(){const q=$('q').value.trim().toLocaleLowerCase('sv-SE');const items=records.filter(x=>x.title.toLocaleLowerCase('sv-SE').includes(q));$('status').textContent=items.length+' annonser';const list=$('products');list.replaceChildren();for(const ad of items){const card=document.createElement('article');card.className='card';if(ad.image_paths?.length){const img=document.createElement('img');img.src=imageUrl(ad.image_paths[0]);img.loading='lazy';img.alt=ad.title;card.append(img)}else{const p=document.createElement('div');p.className='placeholder';p.textContent='Bild saknas';card.append(p)}const body=document.createElement('div');body.className='body';const h=document.createElement('h2');h.textContent=ad.title;body.append(h);const price=document.createElement('div');price.className='price';price.textContent=ad.price_sek.toLocaleString('sv-SE')+' kr';body.append(price);const badge=document.createElement('span');badge.className='badge'+(ad.status==='pending'?' pending':'');badge.textContent=ad.status==='pending'?'Väntande – reserverad':'Till salu';body.append(badge);body.append(button('Visa annons',()=>detail(ad)));card.append(body);list.append(card)}}
function detail(ad){$('overview').classList.add('hidden');const box=$('detail');box.replaceChildren();const bar=document.createElement('div');bar.className='detail-top';bar.append(button('← Tillbaka till annonser',()=>{box.classList.add('hidden');$('overview').classList.remove('hidden')}));box.append(bar);
const banner=document.createElement('div');banner.className='brand-banner';const bt=document.createElement('strong');bt.textContent='Skaraborg Maskin & Återbruk';const bp=document.createElement('p');bp.textContent='Begagnade maskiner, redskap och återbruk från Hjo';banner.append(bt,bp);box.append(banner);
const layout=document.createElement('div');layout.className='detail-layout';const main=document.createElement('article');main.className='detail-main';const title=document.createElement('h2');title.textContent=ad.title;main.append(title);const price=document.createElement('div');price.className='detail-price';price.textContent=Number(ad.price_sek).toLocaleString('sv-SE')+' kr';main.append(price);
if(ad.image_paths?.length){const frame=document.createElement('div');frame.className='gallery-main';const image=document.createElement('img');image.src=imageUrl(ad.image_paths[0]);image.alt=ad.title+' – bild 1';image.style.cursor='zoom-in';image.addEventListener('click',e=>{e.stopPropagation();zoom(image.src,image.alt)});frame.append(image);frame.tabIndex=0;frame.setAttribute('role','button');frame.setAttribute('aria-label','Förstora vald bild');frame.addEventListener('click',()=>zoom(image.src,image.alt));frame.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();zoom(image.src,image.alt)}});main.append(frame);const thumbs=document.createElement('div');thumbs.className='thumb';thumbs.setAttribute('aria-label','Fler bilder på annonsen');ad.image_paths.forEach((path,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Visa bild '+(i+1)+' av '+ad.image_paths.length);b.setAttribute('aria-pressed',String(i===0));const img=document.createElement('img');img.src=imageUrl(path);img.loading='lazy';img.alt='Miniatyr '+(i+1);b.append(img);b.addEventListener('click',()=>{image.src=imageUrl(path);image.alt=ad.title+' – bild '+(i+1);for(const button of thumbs.children)button.setAttribute('aria-pressed',String(button===b))});thumbs.append(b)});main.append(thumbs)}
const state=document.createElement('span');state.className='ad-meta';state.textContent=ad.status==='pending'?'Reserverad / väntande':'Till salu';main.append(state);const heading=document.createElement('h3');heading.textContent='Om maskinen';main.append(heading);const desc=document.createElement('p');desc.className='description';desc.textContent=ad.description||'Kontakta oss för mer information om maskinen.';main.append(desc);const info=document.createElement('p');info.className='muted';info.textContent='Begagnade varor säljs i befintligt skick. Fråga gärna om fler bilder eller information före köp.';main.append(info);layout.append(main);
const aside=document.createElement('aside');aside.className='business-panel';const h=document.createElement('h3');h.textContent='Handla av oss i Skaraborg';const p=document.createElement('p');p.textContent='Vi arbetar med begagnade maskiner, redskap och återbruk. Hör gärna av dig om objektet eller om du har något du vill sälja.';aside.append(h,p);const actionHint=document.createElement('p');actionHint.className='muted';actionHint.textContent='Vill du veta mer om just den här maskinen? Använd kontaktknappen nedan.';aside.append(actionHint);const points=document.createElement('ul');points.className='business-details';for(const t of ['Vi finns i Hjo','Frågor och visning enligt överenskommelse','Vi beskriver skick och kända brister i annonserna']){const li=document.createElement('li');li.textContent=t;points.append(li)}aside.append(points);if(ad.status==='sale'){const link=document.createElement('a');link.href='kontakt.html';link.className='contact-action';link.textContent='Skicka förfrågan om annonsen';link.setAttribute('aria-label','Kontakta oss om '+ad.title);aside.append(link)}else{const p=document.createElement('p');p.textContent='Annonsen är väntande. Vi tar inte emot nya förfrågningar om den just nu.';aside.append(p)}const more=document.createElement('a');more.href='om-oss.html';more.textContent='Läs mer om företaget →';aside.append(more);layout.append(aside);box.append(layout);box.classList.remove('hidden');window.scrollTo(0,0)}
$('q').addEventListener('input',render);$('refresh').addEventListener('click',load);load();
</script></body></html>
