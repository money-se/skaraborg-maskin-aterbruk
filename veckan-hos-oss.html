<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Följ vardagen hos Skaraborg Maskin & Återbruk. Läs om våra hämtningar, maskiner, fynd och vad vi har gjort under veckan."><title>Veckan hos oss | Skaraborg Maskin & Återbruk</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3eb;color:#193624;font:16px/1.6 system-ui,sans-serif}header{background:#193b26;color:white;padding:23px 18px}header a{color:white}.wrap{max-width:950px;margin:auto;padding:20px}h1,h2{line-height:1.2}article{background:white;border:1px solid #d5e2d6;border-radius:17px;padding:25px;margin:22px 0;box-shadow:0 5px 20px #16382210}.date{font-weight:700;color:#56715c;font-size:14px}.body{white-space:pre-wrap;overflow-wrap:anywhere}.photos{display:flex;gap:10px;overflow-x:auto}.photos img{max-height:330px;max-width:min(100%,480px);object-fit:contain;border-radius:10px;cursor:zoom-in}.back{color:#235939}.empty{padding:20px;background:white;border-radius:12px}@media(max-width:600px){article{padding:17px}.photos img{max-height:250px}}</style></head><body><header><div class="wrap"><a href="/">← Till startsidan</a><h1>Veckan hos oss</h1><p>Följ Skaraborg Maskin & Återbruk på vägarna och bakom kulisserna.</p></div></header><main class="wrap"><p>Här berättar vi själva om våra hämtningar, maskiner, fynd och vad som händer under veckorna.</p><div id="posts"><p class="empty">Hämtar veckans berättelser …</p></div></main><script>const U='https://jnorvriiehandxlvwkkg.supabase.co',K='sb_publishable_VZCeFFISX9vzOMlVxYVchg_w1UWYpYR';const list=document.getElementById('posts');fetch(U+'/rest/v1/weekly_blog_posts?select=id,week_start,title,body,image_paths&published=eq.true&order=week_start.desc&limit=80',{headers:{apikey:K}}).then(async r=>{if(!r.ok)throw Error('Kunde inte läsa bloggen');const posts=await r.json();list.replaceChildren();if(!posts.length){const p=document.createElement('p');p.className='empty';p.textContent='Vi har inte publicerat vårt första veckoinlägg än. Titta gärna tillbaka snart!';list.append(p)}for(const item of posts){const a=document.createElement('article');const h=document.createElement('h2');h.textContent=item.title;const date=document.createElement('p');date.className='date';date.textContent='Veckan som börjar '+item.week_start;const body=document.createElement('div');body.className='body';body.textContent=item.body;const photos=document.createElement('div');photos.className='photos';for(const path of item.image_paths||[]){const img=document.createElement('img');img.src=U+'/storage/v1/object/public/ad-images/'+path;img.alt=item.title;img.loading='lazy';img.onclick=()=>window.open(img.src,'_blank','noopener');photos.append(img)}const link=document.createElement('a');const slug=item.title.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,65)||'veckan';link.href='/veckoblogg/'+item.week_start+'-'+slug+'-'+item.id.slice(0,8)+'.html';link.textContent='Läs veckoinlägget på egen sida →';a.append(date,h,body,photos,link);list.append(a)}}).catch(()=>{list.textContent='Bloggen kunde inte hämtas just nu. Försök gärna igen senare.'});</script></body></html>
