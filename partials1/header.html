<header class="smar-site-header">
  <style>
    .smar-site-header{
      position:sticky;
      top:0;
      z-index:1000;
      background:rgba(255,255,255,.97);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border-bottom:1px solid #dfe6df;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    }

    .smar-header-wrap{
      width:min(100% - 40px,1220px);
      min-height:76px;
      margin-inline:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
    }

    .smar-brand{
      color:#142017;
      text-decoration:none;
      font-weight:950;
      letter-spacing:.01em;
      line-height:1.08;
      white-space:nowrap;
    }

    .smar-brand-name{
      display:block;
      font-size:17px;
    }

    .smar-brand-sub{
      display:block;
      margin-top:5px;
      color:#68766b;
      font-size:11px;
      font-weight:750;
      letter-spacing:.045em;
    }

    .smar-nav{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:2px;
    }

    .smar-nav a{
      position:relative;
      padding:10px 9px;
      border-radius:10px;
      color:#1d2b20;
      text-decoration:none;
      font-size:13px;
      font-weight:780;
      white-space:nowrap;
    }

    .smar-nav a:hover,
    .smar-nav a:focus-visible{
      background:#eaf1ea;
      outline:none;
    }

    .smar-nav a[aria-current="page"]{
      background:#eaf1ea;
      color:#142317;
    }

    .smar-nav .smar-dack{
      color:#73540d;
    }

    .smar-nav .smar-facebook{
      color:#405c44;
    }

    .smar-nav .smar-contact{
      margin-left:5px;
      padding:10px 14px;
      background:#142317;
      color:#fff;
    }

    .smar-nav .smar-contact:hover,
    .smar-nav .smar-contact:focus-visible,
    .smar-nav .smar-contact[aria-current="page"]{
      background:#2b4930;
      color:#fff;
    }

    .smar-menu-toggle{
      position:absolute;
      width:1px;
      height:1px;
      overflow:hidden;
      clip:rect(0 0 0 0);
      clip-path:inset(50%);
      white-space:nowrap;
    }

    .smar-menu-button{
      display:none;
      width:44px;
      height:44px;
      padding:0;
      border:1px solid #d7dfd8;
      border-radius:11px;
      background:#fff;
      color:#142017;
      cursor:pointer;
      font-size:23px;
      line-height:1;
      user-select:none;
    }

    .smar-menu-close{display:none}

    .smar-menu-text{
      position:absolute;
      width:1px;
      height:1px;
      overflow:hidden;
      clip:rect(0 0 0 0);
      clip-path:inset(50%);
      white-space:nowrap;
    }

    @media(max-width:1080px){
      .smar-brand-name{font-size:16px}
      .smar-nav a{padding-inline:7px;font-size:12px}
    }

    @media(max-width:940px){
      .smar-header-wrap{
        position:relative;
        min-height:70px;
      }

      .smar-menu-button{
        display:grid;
        place-items:center;
      }

      .smar-nav{
        display:none;
        position:absolute;
        top:calc(100% + 1px);
        left:-20px;
        right:-20px;
        max-height:calc(100vh - 72px);
        overflow:auto;
        padding:10px 20px 16px;
        background:#fff;
        border-bottom:1px solid #dfe6df;
        box-shadow:0 16px 34px rgba(20,35,23,.12);
        flex-direction:column;
        align-items:stretch;
      }

      .smar-menu-toggle:checked ~ .smar-nav{display:flex}

      .smar-menu-toggle:checked + .smar-menu-button .smar-menu-open{display:none}
      .smar-menu-toggle:checked + .smar-menu-button .smar-menu-close{display:inline}

      .smar-menu-toggle:focus-visible + .smar-menu-button{
        outline:3px solid rgba(20,35,23,.25);
        outline-offset:3px;
      }

      .smar-nav a{
        padding:10px 12px;
        font-size:14px;
      }

      .smar-nav .smar-contact{
        margin:6px 0 0;
        text-align:center;
      }
    }

    @media(max-width:520px){
      .smar-header-wrap{
        width:min(100% - 28px,1220px);
      }

      .smar-nav{
        left:-14px;
        right:-14px;
        padding-inline:14px;
      }

      .smar-brand-name{font-size:14px}
      .smar-brand-sub{font-size:9.5px}
    }
  </style>

  <div class="smar-header-wrap">
    <a class="smar-brand" href="/" aria-label="Skaraborg Maskin & &Aring;terbruk &#8211; startsida">
      <span class="smar-brand-name">Skaraborg Maskin &amp; &Aring;terbruk</span>
      <span class="smar-brand-sub">Vi k&ouml;per &#8226; h&auml;mtar &#8226; &aring;terbrukar</span>
    </a>

    <input
      class="smar-menu-toggle"
      type="checkbox"
      id="smar-menu-toggle"
      aria-label="&Ouml;ppna eller st&auml;ng meny">

    <label
      class="smar-menu-button"
      for="smar-menu-toggle"
      aria-controls="smar-main-nav">
      <span class="smar-menu-open" aria-hidden="true">&#9776;</span>
      <span class="smar-menu-close" aria-hidden="true">&#215;</span>
      <span class="smar-menu-text">Meny</span>
    </label>

    <nav class="smar-nav" id="smar-main-nav" aria-label="Huvudmeny">
      <a href="/">Hem</a>
      <a href="/kop-maskiner.html">Vi k&ouml;per</a>
      <a href="/aterbruk.html">&Aring;terbruk</a>
      <a class="smar-dack" href="/dack-hamtning.html">D&auml;ckh&auml;mtning</a>
      <a href="/skrot-hamtning.html">Skroth&auml;mtning</a>
      <a href="/sa-funkar-det.html">S&aring; fungerar det</a>
      <a href="/till-salu.html">Till salu</a>
      <a href="/foretag.html">F&ouml;retag</a>
      <a href="/om-oss.html">Om oss</a>
      <a href="/faq.html">FAQ</a>
      <a class="smar-facebook"
         href="https://www.facebook.com/profile.php?id=61588383880828"
         target="_blank"
         rel="noopener noreferrer">Facebook</a>
      <a class="smar-contact" href="/kontakt.html">Kontakta oss</a>
    </nav>
  </div>
</header>
