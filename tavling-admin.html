<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Månadens maskin – administration</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#eff4ed;color:#193824;font:16px/1.5 system-ui,sans-serif}header{background:#173925;color:#fff;padding:18px}main{max-width:1000px;margin:auto;padding:22px}h1,h2{line-height:1.25}.panel{background:white;border:1px solid #dae3d9;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 5px 22px #10321c0c}label{font-weight:650;display:block;margin-top:12px}input,textarea,select{width:100%;font:inherit;border:1px solid #aabcae;border-radius:9px;padding:11px;background:#fff}textarea{min-height:120px;resize:vertical}button,.button{cursor:pointer;background:#215a36;color:white;border:0;border-radius:9px;padding:11px 15px;font:inherit;text-decoration:none;display:inline-block;margin:5px 5px 5px 0}button.secondary,.button.secondary{background:#e5ede3;color:#173925}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.full{grid-column:1/-1}.hidden{display:none}.thumbs{display:flex;gap:12px;flex-wrap:wrap}.thumbs img{height:100px;max-width:145px;object-fit:cover;border-radius:8px}.entry{border-top:1px solid #ddd;padding:15px 0}.msg{white-space:pre-wrap;color:#285e3a;font-weight:600}.hint{color:#57705f;font-size:.92rem}@media(max-width:640px){main{padding:12px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<header><strong>Skaraborg Maskin & Återbruk – Månadens maskin</strong></header>
<main><p><a href="/admin.html">← Annonsadmin</a> · <a href="/tavlingar.html">Visa tävlingssidan</a></p><p id="message" class="msg">Ansluter…</p>
<section id="login" class="panel hidden"><h1>Logga in</h1><form id="login-form"><label>E-post<input id="email" type="email" autocomplete="username" required></label><label>Lösenord<input id="password" type="password" autocomplete="current-password" required></label><button>Logga in</button></form></section>
<section id="app" class="hidden"><button id="logout" class="secondary">Logga ut</button><section class="panel"><h1>Tävlingar</h1><button id="new">+ Skapa tävling</button><div id="list"></div></section>
<section id="editor" class="panel hidden"><h2 id="form-heading">Ny tävling</h2><form id="form"><div class="grid">
<div class="full"><label for="title">Tävlingsnamn *</label><input id="title" maxlength="120" required placeholder="Månadens maskin #4"></div>
<div class="full"><label for="posturl">Facebooks tävlingsinlägg *</label><textarea id="posturl" placeholder="Klistra in Facebook-länken eller iframe-koden" maxlength="3000"></textarea></div>
<div class="full"><label for="reelurl">Vinnardragning – Reel eller video (lägg till senare)</label><textarea id="reelurl" placeholder="Klistra in Facebook-länken eller iframe-koden när dragningen är klar" maxlength="3000"></textarea></div>
<div><label for="status">Status</label><select id="status"><option value="active">Aktiv</option><option value="ended">Avslutad</option><option value="draft">Utkast</option></select></div>
<div><label for="published">Synlighet</label><select id="published"><option value="true">Publicerad</option><option value="false">Ej publicerad</option></select></div>
<div><label for="testmode">Typ</label><select id="testmode"><option value="false">Riktig tävling</option><option value="true">Testtävling</option></select></div>
<div class="full hidden"><input id="slug" maxlength="100"><textarea id="description"></textarea><textarea id="condition"></textarea><input id="starts"><input id="ends"><input id="facebook"><textarea id="rules"></textarea><input id="winner"><input id="images" type="file"><div id="image-preview"></div></div>
</div><button id="save" type="submit">Spara tävling</button><button id="cancel" type="button" class="secondary">Avbryt</button></form></section></section></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://jnorvriiehandxlvwkkg.supabase.co','sb_publishable_VZCeFFISX9vzOMlVxYVchg_w1UWYpYR',{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
let session=null,records=[],editing=null,existing=[];
const msg=t=>$('message').textContent=t;
const imageUrl=p=>db.storage.from('competition-images').getPublicUrl(p).data.publicUrl;
const dateLocal=s=>s?new Date(new Date(s).getTime()-new Date(s).getTimezoneOffset()*60000).toISOString().slice(0,16):'';
function showLogin(){ $('app').classList.add('hidden');$('login').classList.remove('hidden'); }
async function sync(){const r=await db.auth.getSession();session=r.data.session;if(!session){showLogin();msg('Logga in med samma konto som för annonserna.');return}const a=await db.from('ad_editors').select('user_id').eq('user_id',session.user.id).maybeSingle();if(a.error||!a.data){showLogin();msg('Kontot saknar redaktörsbehörighet.');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');await load();msg('Inloggad och redo.');}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)msg(r.error.message);else{ $('password').value='';await sync();}});
$('logout').onclick=async()=>{await db.auth.signOut();session=null;showLogin();msg('Utloggad.');};
async function load(){const r=await db.from('competitions').select('id,title,slug,description,prize_condition,image_paths,facebook_url,starts_at,ends_at,status,published,rules,winner_name,is_test,facebook_post_url,winner_reel_url,created_at').order('created_at',{ascending:false});if(r.error){msg('Kunde inte läsa tävlingar: '+r.error.message);return}records=r.data;render();}
function btn(label,fn){const b=document.createElement('button');b.textContent=label;b.type='button';b.onclick=fn;return b;}
function render(){const list=$('list');list.replaceChildren();if(!records.length){list.textContent='Inga tävlingar ännu.';return}for(const x of records){const a=document.createElement('div');a.className='entry';const t=document.createElement('strong');t.textContent=x.title;const p=document.createElement('p');p.textContent=(x.is_test?'TEST · ':'')+x.status+' · '+(x.published?'Publicerad':'Ej publicerad');a.append(t,p,btn('Redigera',()=>edit(x)),btn('Radera',()=>removeCompetition(x)));list.append(a)}}
async function removeCompetition(x){if(!confirm('Radera '+x.title+' permanent? Tävlingen tas bort från hemsidan och SEO-arkivet vid nästa publicering. Detta kan inte ångras.'))return;const r=await db.from('competitions').delete().eq('id',x.id).select('id');if(r.error){msg('Kunde inte radera: '+r.error.message);return}if(!r.data?.length){msg('Ingen tävling raderades. Kontrollera behörigheten.');return}const paths=(x.image_paths||[]).filter(p=>typeof p==='string');if(paths.length){const removed=await db.storage.from('competition-images').remove(paths);if(removed.error)msg('Tävlingen är raderad men bilderna kunde inte tas bort: '+removed.error.message);else msg('Tävlingen och bilderna har raderats.');}else msg('Tävlingen har raderats.');$('editor').classList.add('hidden');await load()}
function setPictures(paths){const el=$('image-preview');el.replaceChildren();paths.forEach(p=>{const img=document.createElement('img');img.src=imageUrl(p);img.alt='Befintlig tävlingsbild';el.append(img)})}
function clear(){editing=null;existing=[];$('form').reset();$('slug').dataset.manual='0';$('slug').readOnly=false;setPictures([]);$('form-heading').textContent='Ny tävling';$('editor').classList.remove('hidden');msg('Fyll i formuläret nedan och klicka på Spara tävling.');$('editor').scrollIntoView({behavior:'smooth',block:'start'});$('title').focus({preventScroll:true});}
$('new').onclick=clear;$('cancel').onclick=()=>$('editor').classList.add('hidden');
function edit(x){editing=x.id;existing=x.image_paths||[];for(const [key,val] of Object.entries({title:x.title,slug:x.slug,description:x.description,condition:x.prize_condition,starts:dateLocal(x.starts_at),ends:dateLocal(x.ends_at),facebook:x.facebook_url,rules:x.rules,status:x.status,published:String(x.published),winner:x.winner_name,testmode:String(x.is_test),posturl:x.facebook_post_url,reelurl:x.winner_reel_url}))$(key).value=val||'';$('published').value=String(x.published);$('slug').readOnly=true;setPictures(existing);$('form-heading').textContent='Redigera tävling';$('editor').classList.remove('hidden');$('editor').scrollIntoView({behavior:'smooth',block:'start'});}
$('title').addEventListener('input',()=>{if(editing||$('slug').dataset.manual==='1')return;$('slug').value=$('title').value.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80)});
$('slug').addEventListener('input',()=>$('slug').dataset.manual='1');
function facebookOriginal(input,kind){let s=(input||'').trim();if(!s)return '';if(s.includes('<iframe')){const match=s.match(/src\s*=\s*["']([^"']+)/i);if(!match)throw Error('Kunde inte läsa iframe-länken');s=match[1].replace(/&amp;/g,'&')}let u;try{u=new URL(s)}catch{throw Error('Ange en giltig Facebook-länk eller iframe-kod')}if(u.hostname==='www.facebook.com'&&u.pathname.startsWith('/plugins/')){const embedded=u.searchParams.get('href');if(!embedded)throw Error('Facebooks inbäddning saknar originaladress');u=new URL(embedded)}if(u.protocol!=='https:'||!['www.facebook.com','facebook.com','m.facebook.com','fb.watch'].includes(u.hostname))throw Error('Endast Facebook-länkar accepteras');if(kind==='reel'&&!(u.pathname.startsWith('/reel/')||u.pathname.includes('/videos/')||u.hostname==='fb.watch'))throw Error('Ange en länk till Reel eller Facebook-video');return u.toString()}
function compress(file){return new Promise((resolve,reject)=>{const u=URL.createObjectURL(file),img=new Image();img.onload=()=>{const f=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*f));c.height=Math.max(1,Math.round(img.height*f));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?resolve(b):reject(Error('Bildkomprimeringen misslyckades'))},'image/webp',.76)};img.onerror=()=>{URL.revokeObjectURL(u);reject(Error('Bilden kunde inte läsas'))};img.src=u})}
$('form').addEventListener('submit',async e=>{e.preventDefault();const save=$('save');save.disabled=true;try{
const paths=existing.slice(),files=[...$('images').files];if(files.length>10)throw Error('Högst tio bilder.');
if(files.length){paths.length=0;for(const f of files){if(!['image/jpeg','image/png','image/webp'].includes(f.type))throw Error('Otillåtet bildformat');const blob=await compress(f);if(blob.size>1048576)throw Error('Bilden är för stor');const path=session.user.id+'/'+crypto.randomUUID()+'.webp';const r=await db.storage.from('competition-images').upload(path,blob,{contentType:'image/webp'});if(r.error)throw r.error;paths.push(path)}}
const s=$('status').value,pub=$('published').value==='true';const starts=$('starts').value?new Date($('starts').value).toISOString():null,ends=$('ends').value?new Date($('ends').value).toISOString():null;
const record={title:$('title').value.trim(),slug:$('slug').value.trim(),description:$('description').value.trim(),prize_condition:$('condition').value.trim(),starts_at:starts,ends_at:ends,facebook_url:$('facebook').value.trim(),rules:$('rules').value.trim(),winner_name:$('winner').value.trim(),facebook_post_url:facebookOriginal($('posturl').value,'post'),winner_reel_url:facebookOriginal($('reelurl').value,'reel'),is_test:$('testmode').value==='true',status:s,published:pub,image_paths:paths,updated_at:new Date().toISOString()};
if(s==='active'&&!record.is_test&&!record.facebook_post_url&&!record.facebook_url)throw Error('Klistra in tävlingsinläggets Facebook-länk.');
if(record.is_test&&pub&&s==='active'&&!confirm('Publicera en tydligt märkt TESTTÄVLING på hemsidan? Besökare kommer se att den inte går att delta i.'))return;
if(pub&&s==='draft')throw Error('Välj Aktiv eller Avslutad för att publicera.');
if(record.facebook_post_url)record.facebook_url=record.facebook_post_url;
const r=editing?await db.from('competitions').update(record).eq('id',editing):await db.from('competitions').insert(record);
if(r.error)throw r.error;$('editor').classList.add('hidden');await load();msg('Tävlingen sparades.');
}catch(err){msg('Kunde inte spara: '+err.message);$('message').scrollIntoView({behavior:'smooth',block:'center'});}finally{save.disabled=false}});
sync().catch(e=>{showLogin();msg('Anslutningsfel: '+e.message)});
</script></body></html>
